# Cliente bancario: continuidad extrema. La respuesta automatica NUNCA corta un servicio ni toca
# las joyas de la corona (HSM, SWIFT, core DB) ni el plano de gestion; el unico automatismo posible
# es un bloqueo de IP de origen (localizado y reversible) y solo con confianza muy alta (Opcion A).
version: v0

# Inventario (RF-17): criticidad gobierna la prioridad (critica/alta suben); servicios_prestados son
# los puertos del servicio; ip y funcion dicen a quien toca cada accion. IPs con el patron
# 10.<VLAN>.0.10 (SWIFT no tenia VLAN numerada: se usa la 30, libre entre la DMZ 20 y el Core 40).
# depende_de (Nivel 2): si cae uno de esos activos, este se ve afectado.
activos:
  web-banking:    { ip: 10.10.0.10,  funcion: "banca en linea (portal web de clientes)",       criticidad: alta,    servicios_prestados: [443, 80], depende_de: [middleware] }   # DMZ VLAN 10
  api-movil:      { ip: 10.20.0.10,  funcion: "API de la aplicacion movil",                    criticidad: alta,    servicios_prestados: [443], depende_de: [middleware] }       # DMZ VLAN 20
  swift-alliance: { ip: 10.30.0.10,  funcion: "pasarela SWIFT Alliance (transferencias)",      criticidad: critica, servicios_prestados: [48002], depende_de: [hsm] }     # DMZ SWIFT
  middleware:     { ip: 10.40.0.10,  funcion: "middleware del core bancario",                  criticidad: alta,    servicios_prestados: [8443], depende_de: [core-db, hsm] }      # Core VLAN 40
  core-db:        { ip: 10.50.0.10,  funcion: "base de datos del core bancario (cluster)",     criticidad: critica, servicios_prestados: [1521] }      # Core VLAN 50
  hsm:            { ip: 10.60.0.10,  funcion: "modulo de seguridad de hardware (cifrado)",     criticidad: critica, servicios_prestados: [9000] }       # Core VLAN 60
  mdr-siem:       { ip: 10.100.0.10, funcion: "consola SOC/MDR (plano de gestion)",            criticidad: critica, servicios_prestados: [] }          # SOC VLAN 100
  # atm depende DE VERDAD de middleware en el laboratorio del banco, y aqui NO se declara a proposito:
  # es el caso K3 (dependencia no declarada -> falso "sin cascada"). Ver lab/banco/red.py.
  atm:            { ip: 10.210.0.10, funcion: "cajero automatico de sucursal",                 criticidad: alta,    servicios_prestados: [8080] }       # Sucursal VLAN 210
  taquilla:       { ip: 10.200.0.10, funcion: "puesto de taquilla de sucursal",                criticidad: media,   servicios_prestados: [] }          # Sucursal VLAN 200
# Toda la red del banco: una IP 10.x no inventariada tambien es un activo interno.
redes_internas: ["10.0.0.0/8"]

# Origenes cuya actividad es legitima (RNF-14). Match EXACTO por IP (redes_internas si admite CIDR):
# la administracion del banco (SOC/MDR) y el auditor autorizado.
origenes_legitimos: ["10.100.0.10", "10.100.0.20"]
# Terceros externos de confianza (socios criticos: pasarela de pago, proveedor). NO son origenes
# legitimos (eso seria FP e ignorarlo): un ataque aparente desde ellos SI es amenaza, pero no se
# auto-bloquea —cortarlos tiraria un servicio de negocio—, se retiene para aprobacion humana.
# Admite IP exacta o CIDR. Ejemplo (vacio por defecto):
# terceros_confiables: ["203.0.113.7", "198.51.100.0/24"]
# Plano de gestion: RF-19 (no_cortar_gestion) impide que ninguna accion lo afecte.
ip_gestion: 10.100.0.10

# A partir de cuantas alertas del mismo origen en la ventana se considera ataque aunque el origen
# este declarado legitimo (suplantacion o equipo comprometido): la 6a regla, confianza 0.6.
rafaga: { umbral: 9, ventana_s: 60 }

continuidad:
  impacto_ninguno:            automatica            # observar/enriquecer: siempre
  impacto_localizado:         automatica_si_confianza  # Opcion A: bloqueo de IP auto solo si confianza alta
  impacto_alcanza_servicio:   humano_siempre        # nada que roce un servicio se corta solo
  reversibilidad_obligatoria: true                  # RF-18: solo acciones reversibles y verificables
  no_cortar_gestion:          true                  # RF-19: jamas el plano SOC/gestion
  umbral_confianza:           0.9                   # barra alta para cualquier automatismo (RF-07)
  actores:                                          # C1: bloquear lo propio exige humano
    activo_interno:           humano_siempre
    dispositivo_red:          humano_siempre

# Servicios de las joyas de la corona: nunca de forma automatica (refuerza humano_siempre; RF-17).
# Su bloqueo de puerto degrada a bloqueo de la IP atacante, que no corta el servicio del banco.
excepciones:
  - { servicio: 1521, activo: core-db,    regla: nunca_automatica }   # DB Core
  - { servicio: 8443, activo: middleware, regla: nunca_automatica }   # Middleware

# Cadena de contencion host -> firewall core -> firewall perimetral (dos firewalls HA de la
# topologia). Roles reconocidos por el motor: host_victima (BLOQUEAR_IP) y firewall_perimetral
# (BLOQUEAR_IP_FIREWALL). Las joyas de la corona NO se listan como host: una contencion sobre
# ellas escala directa al firewall (contener aguas arriba, nunca tocar el activo critico).
topologia:
  web-banking: { rol: host_victima,        ip: 10.10.0.10,  gateway: fw-core }
  api-movil:   { rol: host_victima,        ip: 10.20.0.10,  gateway: fw-core }
  atm:         { rol: host_victima,        ip: 10.210.0.10, gateway: fw-core }
  fw-core:     { rol: firewall_perimetral, ip: 10.0.0.1,    gateway: fw-edge }
  fw-edge:     { rol: firewall_perimetral, ip: 10.0.0.254 }

# Binding de rutas logicas -> destinos reales del cliente (nivel triar_y_enrutar).
rutas:
  appsec: cola-appsec-banco

# Mapa de la red para la vista «Red» del visor (solo presentación: la contención lee `topologia`).
# Refleja lab/topologias/banco.clab.yml; lo comprueba lab/banco/tests/test_red_perfil.py.
red:
  nodos:
    internet: { tipo: externo }
    sw-soc:   { tipo: switch }
    auditor:  { tipo: gestion, ip: 10.100.0.20, funcion: "auditor de vulnerabilidades (Nmap)" }
  enlaces:
    fw-edge: internet
    fw-core: fw-edge
    web-banking: fw-core
    api-movil: fw-core
    swift-alliance: fw-core
    middleware: fw-core
    core-db: fw-core
    hsm: fw-core
    taquilla: fw-core
    atm: fw-core
    sw-soc: fw-core
    mdr-siem: sw-soc
    auditor: sw-soc
  zonas:
    DMZ:      [web-banking, api-movil, swift-alliance]
    Core:     [middleware, core-db, hsm]
    Sucursal: [taquilla, atm]
    SOC:      [sw-soc, mdr-siem, auditor]
