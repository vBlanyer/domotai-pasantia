# Registro de familias de ataque: familia -> {mitre, nivel, ruta}. Extensible y alineado a MITRE.
# nivel: 'actuar' (contener con el catalogo) | 'triar_y_enrutar' (clasificar + encaminar, sin contener).
# Una familia AUSENTE de este registro -> no_soportada (frontera honesta). 'plataforma'/'otra' no se listan.
acceso_credenciales:  { mitre: [T1110, T1078], nivel: actuar }
reconocimiento:       { mitre: [T1595, T1046], nivel: actuar }
servicio_expuesto:    { mitre: [T1190],        nivel: actuar }
explotacion_conocida: { mitre: [T1190, T1210, T1203], nivel: triar_y_enrutar, ruta: appsec }
# Escalada de privilegios / manipulacion de cuentas: la respuesta no es bloquear la IP origen sino la
# CUENTA. El campo opcional 'clase' deja que el registro declare esa respuesta sin tocar el clasificador.
abuso_de_cuenta:      { mitre: [T1548, T1136, T1098], nivel: actuar, clase: vp_abuso_cuenta }
# Integridad de ficheros (FIM de Wazuh, grupo 'syscheck'): un fichero critico cambio/desaparecio en un
# activo. El evento es la amenaza; la respuesta no bloquea una IP ni una cuenta, sino que AISLA el host
# para investigarlo (AISLAR_NODO es nunca_automatica -> siempre validacion humana).
integridad_fichero:   { mitre: [T1565, T1070], nivel: actuar, clase: vp_integridad }
