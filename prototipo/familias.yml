# Registro de familias de ataque: familia -> {mitre, nivel, ruta}. Extensible y alineado a MITRE.
# nivel: 'actuar' (contener con el catalogo) | 'triar_y_enrutar' (clasificar + encaminar, sin contener).
# Una familia AUSENTE de este registro -> no_soportada (frontera honesta). 'plataforma'/'otra' no se listan.
acceso_credenciales:  { mitre: [T1110, T1078], nivel: actuar }
reconocimiento:       { mitre: [T1595, T1046], nivel: actuar }
servicio_expuesto:    { mitre: [T1190],        nivel: actuar }
explotacion_conocida: { mitre: [T1190, T1210, T1203], nivel: triar_y_enrutar, ruta: appsec }
# Escalada de privilegios / manipulacion de cuentas: la respuesta no es bloquear la IP origen sino la
# CUENTA. El campo opcional 'clase' deja que el registro declare esa respuesta sin tocar el clasificador.
abuso_de_cuenta:      { mitre: [T1548, T1136, T1098], nivel: actuar, clase: vp_abuso_cuenta }
# Integridad de ficheros (FIM de Wazuh, grupo 'syscheck'): un fichero critico cambio/desaparecio en un
# activo. El evento es la amenaza; la respuesta no bloquea una IP ni una cuenta, sino que AISLA el host
# para investigarlo (AISLAR_NODO es nunca_automatica -> siempre validacion humana).
integridad_fichero:   { mitre: [T1565, T1070], nivel: actuar, clase: vp_integridad }
# Denegacion de servicio (DoS/flood volumetrico, reglas de frecuencia de Wazuh): no hay una IP unica
# que bloquear, asi que la respuesta es ACOTAR la banda del enlace (LIMITAR_BANDA): contencion GRADUAL,
# degradar para mantener el servicio vivo en vez de tirarlo. Reversible y menos drastica que aislar.
denegacion_servicio:  { mitre: [T1498, T1499], nivel: actuar, clase: vp_denegacion_servicio }
# Acceso consumado: el atacante YA entro (login exitoso desde una IP que venia haciendo fuerza bruta,
# regla compuesta local de Wazuh). La respuesta no bloquea el trafico futuro sino que CORTA la conexion
# viva del atacante (MATAR_CONEXION, sobre su IP de origen). Reutiliza clase+accion ya existentes.
acceso_consumado:     { mitre: [T1078, T1021], nivel: actuar, clase: vp_acceso_consumado }
# Exfiltracion / C2: un activo interno conecta a un DESTINO malicioso conocido (lista de amenazas del
# SIEM). La respuesta estrena una DIRECCION nueva: bloquear el DESTINO (egreso) en el borde, no el
# origen (BLOQUEAR_DESTINO). Deteccion en alcance = match con lista CDB/threat-intel, NO C2 conductual.
exfiltracion:         { mitre: [T1041, T1071], nivel: actuar, clase: vp_exfiltracion }
# Malware / rootkit: Wazuh (rootcheck + VirusTotal) marca un binario/fichero malicioso en un activo. La
# respuesta correcta es AISLAR el host (igual que integridad_fichero); aqui aporta el RECONOCIMIENTO
# explicito (en vez de no_soportada). Requiere agente Wazuh en produccion; en el banco es sintetico.
malware:              { mitre: [T1014, T1486], nivel: actuar, clase: vp_malware }
