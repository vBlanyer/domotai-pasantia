# Variante con el equipo de borde OpenWrt real: primer tramo de la red del cliente, con el
# CPE ejecutando OpenWrt de verdad (VM QEMU empaquetada por vrnetlab).
#
#   borde  --- WAN ---  cpe (OpenWrt)  --- LAN ---  abonado
#
# Interfaces del nodo OpenWrt, segun vrnetlab:
#   eth0 = gestion (red clab)   eth1 = WAN   eth2 = LAN
#
# La imagen se construye localmente; ver lab/README.md.
# Credenciales por defecto de vrnetlab: root / VR-netlab9
#
# AVISO: "host" es un nombre reservado en containerlab (namespace raiz de la
# maquina). Por eso el nodo del abonado se llama "puesto".

name: red-cliente-openwrt

topology:
  nodes:
    proveedor:
      kind: linux
      image: alpine:latest
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - ip addr add 10.0.1.1/24 dev eth1

    borde:
      kind: openwrt
      image: vrnetlab/openwrt_openwrt:24.10.0
      ports:
        # 8080 lo ocupa otro proyecto del equipo; se usan puertos altos libres
        - 8180:80     # LuCI HTTP
        - 8543:443    # LuCI HTTPS

    puesto:
      kind: linux
      image: alpine:latest
      # sin direccion estatica: debe obtenerla por DHCP del CPE

  links:
    - endpoints: ["proveedor:eth1", "borde:eth1"]      # tramo de acceso (WAN)
    - endpoints: ["borde:eth2", "puesto:eth1"]    # LAN del abonado
