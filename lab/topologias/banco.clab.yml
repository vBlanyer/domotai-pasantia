# Laboratorio del banco (spec archivo/proceso-desarrollo/superpowers/specs/2026-09-21-laboratorio-banco-design.md §5).
# Misma red que prototipo/perfiles/bancario.yml; la fuente unica de IPs y servicios es lab/banco/red.py
# (lab/banco/tests/test_topologia.py comprueba que coinciden).
#
#   internet ── fw-edge ── fw-core ─┬─ web-banking 10.10 · api-movil 10.20 · swift-alliance 10.30
#                                   ├─ middleware 10.40 · core-db 10.50 · hsm 10.60
#                                   ├─ taquilla 10.200 · atm 10.210
#                                   └─ sw-soc ─┬─ mdr-siem 10.100.0.10 (MDR y conector; ip_gestion)
#                                              └─ auditor  10.100.0.20
#
# Las rutas de datos son especificas (10.0.0.0/8, 198.51.100.0/24); el resto de nodos conserva
# la ruta por defecto de gestion (eth0, solo para docker exec/SSH del conector), como en
# red-cliente. 'internet' es la excepcion: containerlab tambien lo conecta a la red de gestion
# de Docker, que le daria salida real; su ruta por defecto se borra y eth0 se bloquea de salida
# (C1), asi que 'internet' no tiene salida real: es un nodo mas del laboratorio.
#
# I2: ademas, banco.sh 'up' anade en cada nodo del plano de datos con sshd/servicios
# (web-banking api-movil swift-alliance middleware core-db hsm atm taquilla fw-core fw-edge
# mdr-siem auditor) la regla 'iptables -A INPUT -i eth0 -p tcp -j DROP': sshd y los servicios
# HTTP escuchan en 0.0.0.0 (tambien en eth0/gestion), que no pasa por ningun cortafuegos del
# banco; sin esa regla, alguien con acceso a la red de gestion se saltaba fw-edge y fw-core.
# Se levanta con: sh lab/lab.sh up banco   (no convive con red-cliente: misma red de gestion)

name: banco

topology:
  defaults:
    kind: linux
    image: banco-nodo:1

  nodes:
    internet:
      labels: {ip-eth1: 198.51.100.10/24}   # la IP de datos, visible en la pestaña YAML de la extensión
      # containerlab conecta este nodo tambien a la red de gestion de Docker (eth0, NAT), que
      # le da una ruta por defecto real: 'docker exec' no pasa por ella, pero el propio
      # contenedor si tendria salida real a Internet. Se borra esa ruta y se bloquea eth0 de
      # salida con iptables para que quede aislado de verdad (RNF-01): solo sabe llegar al
      # banco por eth1 (198.51.100.0/24 -> 10.0.0.0/8).
      exec:
        - ip addr add 198.51.100.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 198.51.100.1
        - ip route del default
        - iptables -A OUTPUT -o eth0 -j DROP

    fw-edge:
      labels: {ip-eth1: 198.51.100.1/24, ip-eth2: 10.0.0.254/24}   # la IP de datos, visible en la pestaña YAML de la extensión
      sysctls: {net.ipv4.ip_forward: 1}
      exec:
        - ip addr add 198.51.100.1/24 dev eth1
        - ip addr add 10.0.0.254/24 dev eth2
        - ip route add 10.0.0.0/8 via 10.0.0.1

    fw-core:
      labels: {ip-eth1: 10.0.0.1/24, ip-eth2: 10.10.0.1/24, ip-eth3: 10.20.0.1/24, ip-eth4: 10.30.0.1/24, ip-eth5: 10.40.0.1/24, ip-eth6: 10.50.0.1/24, ip-eth7: 10.60.0.1/24, ip-eth8: 10.100.0.1/24, ip-eth9: 10.200.0.1/24, ip-eth10: 10.210.0.1/24, ip-eth11: 10.70.0.1/24}   # la IP de datos, visible en la pestaña YAML de la extensión
      sysctls: {net.ipv4.ip_forward: 1}
      exec:
        - ip addr add 10.0.0.1/24 dev eth1
        - ip addr add 10.10.0.1/24 dev eth2
        - ip addr add 10.20.0.1/24 dev eth3
        - ip addr add 10.30.0.1/24 dev eth4
        - ip addr add 10.40.0.1/24 dev eth5
        - ip addr add 10.50.0.1/24 dev eth6
        - ip addr add 10.60.0.1/24 dev eth7
        - ip addr add 10.100.0.1/24 dev eth8
        - ip addr add 10.200.0.1/24 dev eth9
        - ip addr add 10.210.0.1/24 dev eth10
        - ip addr add 10.70.0.1/24 dev eth11      # pagos-qr: equipo por dar de alta desde la consola
        - ip route add 198.51.100.0/24 via 10.0.0.254

    sw-soc:
      exec:
        - ip link add br0 type bridge
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set br0 up

    web-banking:
      labels: {ip-eth1: 10.10.0.10/24}   # la IP de datos, visible en la pestaña YAML de la extensión
      exec: ["ip addr add 10.10.0.10/24 dev eth1", "ip route add 10.0.0.0/8 via 10.10.0.1", "ip route add 198.51.100.0/24 via 10.10.0.1"]
    api-movil:
      labels: {ip-eth1: 10.20.0.10/24}   # la IP de datos, visible en la pestaña YAML de la extensión
      exec: ["ip addr add 10.20.0.10/24 dev eth1", "ip route add 10.0.0.0/8 via 10.20.0.1", "ip route add 198.51.100.0/24 via 10.20.0.1"]
    swift-alliance:
      labels: {ip-eth1: 10.30.0.10/24}   # la IP de datos, visible en la pestaña YAML de la extensión
      exec: ["ip addr add 10.30.0.10/24 dev eth1", "ip route add 10.0.0.0/8 via 10.30.0.1", "ip route add 198.51.100.0/24 via 10.30.0.1"]
    middleware:
      labels: {ip-eth1: 10.40.0.10/24}   # la IP de datos, visible en la pestaña YAML de la extensión
      exec: ["ip addr add 10.40.0.10/24 dev eth1", "ip route add 10.0.0.0/8 via 10.40.0.1", "ip route add 198.51.100.0/24 via 10.40.0.1"]
    core-db:
      labels: {ip-eth1: 10.50.0.10/24}   # la IP de datos, visible en la pestaña YAML de la extensión
      exec: ["ip addr add 10.50.0.10/24 dev eth1", "ip route add 10.0.0.0/8 via 10.50.0.1", "ip route add 198.51.100.0/24 via 10.50.0.1"]
    hsm:
      labels: {ip-eth1: 10.60.0.10/24}   # la IP de datos, visible en la pestaña YAML de la extensión
      exec: ["ip addr add 10.60.0.10/24 dev eth1", "ip route add 10.0.0.0/8 via 10.60.0.1", "ip route add 198.51.100.0/24 via 10.60.0.1"]
    mdr-siem:
      labels: {ip-eth1: 10.100.0.10/24}   # la IP de datos, visible en la pestaña YAML de la extensión
      exec: ["ip addr add 10.100.0.10/24 dev eth1", "ip route add 10.0.0.0/8 via 10.100.0.1", "ip route add 198.51.100.0/24 via 10.100.0.1"]
    auditor:
      labels: {ip-eth1: 10.100.0.20/24}   # la IP de datos, visible en la pestaña YAML de la extensión
      exec: ["ip addr add 10.100.0.20/24 dev eth1", "ip route add 10.0.0.0/8 via 10.100.0.1", "ip route add 198.51.100.0/24 via 10.100.0.1"]
    taquilla:
      labels: {ip-eth1: 10.200.0.10/24}   # la IP de datos, visible en la pestaña YAML de la extensión
      exec: ["ip addr add 10.200.0.10/24 dev eth1", "ip route add 10.0.0.0/8 via 10.200.0.1", "ip route add 198.51.100.0/24 via 10.200.0.1"]
    atm:
      labels: {ip-eth1: 10.210.0.10/24}   # la IP de datos, visible en la pestaña YAML de la extensión
      exec: ["ip addr add 10.210.0.10/24 dev eth1", "ip route add 10.0.0.0/8 via 10.210.0.1", "ip route add 198.51.100.0/24 via 10.210.0.1"]

    pagos-qr:
      labels: {ip-eth1: 10.70.0.10/24}   # la IP de datos, visible en la pestaña YAML de la extensión
      # Equipo NUEVO: no esta en el perfil ni lo aprovisiona el script. Se da de alta desde la vista
      # Conectividad (PLAN-PRUEBA-CONECTIVIDAD-SIN-SCRIPT.md). Ver lab/banco/red.py POR_DAR_DE_ALTA.
      exec: ["ip addr add 10.70.0.10/24 dev eth1", "ip route add 10.0.0.0/8 via 10.70.0.1", "ip route add 198.51.100.0/24 via 10.70.0.1"]

  links:
    - endpoints: ["internet:eth1", "fw-edge:eth1"]
    - endpoints: ["fw-edge:eth2", "fw-core:eth1"]
    - endpoints: ["fw-core:eth2", "web-banking:eth1"]
    - endpoints: ["fw-core:eth3", "api-movil:eth1"]
    - endpoints: ["fw-core:eth4", "swift-alliance:eth1"]
    - endpoints: ["fw-core:eth5", "middleware:eth1"]
    - endpoints: ["fw-core:eth6", "core-db:eth1"]
    - endpoints: ["fw-core:eth7", "hsm:eth1"]
    - endpoints: ["fw-core:eth8", "sw-soc:eth1"]
    - endpoints: ["sw-soc:eth2", "mdr-siem:eth1"]
    - endpoints: ["sw-soc:eth3", "auditor:eth1"]
    - endpoints: ["fw-core:eth9", "taquilla:eth1"]
    - endpoints: ["fw-core:eth10", "atm:eth1"]
    - endpoints: ["fw-core:eth11", "pagos-qr:eth1"]
