# Sandbox — topologia de trabajo: la red del cliente desde el punto de entrega.
#
#   proveedor ──WAN── borde ──LAN── sw-lan ─┬─ puesto
#                                           ├─ iot
#                                           └─ objetivo-vuln
#   auditor  (solo plano de gestion)
#
# El equipo de BORDE es PROVISIONAL: un contenedor Linux que encamina y sirve DHCP, en
# lugar de OpenWrt. El kind openwrt esta bloqueado por un cuelgue del bootstrap
# de vrnetlab; ver lab/mediciones.md. Cuando se resuelva, basta cambiar el kind
# y la imagen de este nodo.
#
# AVISO: "host" es un nombre reservado en containerlab (namespace raiz).
#
# Direccionamiento
#   Acceso (WAN):  10.0.1.0/24    proveedor .1  borde .2
#   LAN interna:   192.168.1.0/24 borde .1      puesto .10  iot .20  vuln .30
#   Gestion:       172.20.20.0/24 (la crea containerlab sola)
#
# La ruta por defecto pertenece a la red de gestion (eth0). El plano de datos
# usa rutas especificas para no pisarla y no perder el acceso a los nodos.

name: red-cliente

topology:
  defaults:
    kind: linux
    image: alpine:latest

  nodes:
    proveedor:
      labels: {graph-icon: router, graph-group: "Proveedor", graph-level: 1}
      sysctls: {net.ipv4.ip_forward: 1}
      exec:
        - ip addr add 10.0.1.1/24 dev eth1
        - ip route add 192.168.1.0/24 via 10.0.1.2

    borde:
      labels: {graph-icon: router, graph-group: "Red del cliente", graph-level: 2}
      # IP de gestion FIJA: el auditor encamina el trafico de escaneo a traves de
      # esta direccion. Sin fijarla, containerlab la reasigna en cada deploy y las
      # rutas del auditor quedan apuntando al nodo equivocado.
      mgmt-ipv4: 172.20.20.100
      sysctls: {net.ipv4.ip_forward: 1}
      exec:
        - ip addr add 10.0.1.2/24 dev eth1
        - ip addr add 192.168.1.1/24 dev eth2

    sw-lan:
      labels: {graph-icon: switch, graph-group: "Red del cliente", graph-level: 3}
      exec:
        - ip link add br0 type bridge
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth4 master br0
        - ip link set br0 up

    puesto:
      labels: {graph-icon: pc, graph-group: "Red del cliente", graph-level: 4}
      exec:
        - ip addr add 192.168.1.10/24 dev eth1
        - ip route add 10.0.1.0/24 via 192.168.1.1

    iot:
      labels: {graph-icon: server, graph-group: "Red del cliente", graph-level: 4}
      # Dispositivo domestico con servicios de administracion expuestos, que es
      # la superficie tipica de una camara o un enchufe inteligente sin parchear.
      #   23/tcp  telnet sin cifrar y SIN AUTENTICACION -> shell directa
      #   80/tcp  interfaz web de administracion
      exec:
        - ip addr add 192.168.1.20/24 dev eth1
        - ip route add 10.0.1.0/24 via 192.168.1.1
        - apk add --no-cache busybox-extras darkhttpd
        - mkdir -p /www
        - sh -c 'echo "<html><head><title>IPCam-2000 Admin</title></head><body><h1>IPCam-2000</h1><p>Firmware v1.0.3 (2016-04-11)</p><form><input name=user value=admin><input name=pass type=password><button>Entrar</button></form></body></html>" > /www/index.html'
        - telnetd -l /bin/sh -p 23
        - darkhttpd /www --port 80 --daemon

    objetivo-vuln:
      labels: {graph-icon: server, graph-group: "Red del cliente", graph-level: 4}
      # Metasploitable2: objetivo con vulnerabilidades DOCUMENTADAS. De este nodo
      # sale el ground truth de la evaluacion: se sabe de antemano que deberia
      # encontrar el auditor y que seria un falso positivo.
      # Inventario esperado en vulnerabilidades-esperadas.md
      image: tleemcjr/metasploitable2:latest
      # WAZUH_IP: IP de gestion del manager. Ver lab/reenvio-syslog.sh
      exec:
        - ip addr add 192.168.1.30/24 dev eth1
        - ip route add 10.0.1.0/24 via 192.168.1.1

    auditor:
      labels: {graph-icon: controller, graph-group: "Gestion", graph-level: 1}
      # Solo esta en el plano de gestion: no aparece en ningun enlace.
      # Para escanear el plano de datos encamina a traves del equipo de borde.
      # IP de gestion FIJA: el perfil de cliente la declara como origen legitimo. Se
      # midio que, sin declararla, el prototipo clasificaba los barridos del propio
      # auditor como ataque y habria bloqueado a su instrumento de medida.
      mgmt-ipv4: 172.20.20.4
      exec:
        - apk add --no-cache nmap nmap-scripts
        - ip route add 192.168.1.0/24 via 172.20.20.100
        - ip route add 10.0.1.0/24 via 172.20.20.100

  links:
    - endpoints: ["proveedor:eth1", "borde:eth1"]
    - endpoints: ["borde:eth2", "sw-lan:eth1"]
    - endpoints: ["sw-lan:eth2", "puesto:eth1"]
    - endpoints: ["sw-lan:eth3", "iot:eth1"]
    - endpoints: ["sw-lan:eth4", "objetivo-vuln:eth1"]
